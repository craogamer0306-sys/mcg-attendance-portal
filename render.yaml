services:
  - type: web
    name: mcg-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase: mcg-db
        property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DB_ID
        sync: false
      - key: APP_BASE_URL
        value: https://mcg-api.onrender.com
      - key: TIMEZONE
        value: Asia/Kolkata
  - type: web
    name: mcg-web
    env: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    headers:
      - path: /*
        name: Cache-Control
        value: max-age=0, no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: mcg-db
    plan: starter
